<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Panneaux & bannière – VTuber</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@1,500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════════════════
   1) VARIABLES
   ════════════════════════════════════════════════════════════ */
:root{
  --violet-deep:#4B0082; --violet:#6A0DAD; --magenta:#B5179E;
  --charcoal:#0D0D12;
  --gold:#C9A24B; --gold-light:#F3DC9A;
  --crystal:#3FA9FF; --crystal-light:#6FE7FF;
  --crimson:#D6204E; --silver:#D9D9E3;
  --font-title:'Cinzel','Times New Roman',serif;
  --font-slogan:'Cormorant Garamond',Georgia,serif;
  --font-ui:'Rajdhani','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0a0612;color:var(--silver);font-family:var(--font-ui)}
body.overlay{overflow:hidden;background:transparent}
body.overlay #gallery{display:none}
body:not(.overlay) #stage{display:none}

/* ═══════ GALERIE (export PNG) ═══════ */
#gallery{
  min-height:100vh;padding:48px 40px 80px;
  background:radial-gradient(ellipse 70% 40% at 50% 0%,#2b0a4a 0%,#12091f 55%,#0a0612 100%);
}
#gallery h1{
  font-family:var(--font-title);font-weight:800;font-size:40px;letter-spacing:.14em;text-align:center;color:var(--gold-light);
  text-shadow:0 0 24px rgba(181,23,158,.6);
}
#gallery .hint{max-width:760px;margin:12px auto 44px;text-align:center;font-size:20px;line-height:1.4;color:var(--silver);opacity:.85}
#grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:48px}
.item{display:flex;flex-direction:column;align-items:center;gap:16px}
.dl{
  font:600 20px var(--font-ui);letter-spacing:.08em;color:var(--gold-light);cursor:pointer;
  background:#1a0f30;border:2px solid var(--gold);padding:10px 22px;
}
.dl:hover{background:#2b1650}
#bannerItem{margin-top:56px;display:flex;flex-direction:column;align-items:center;gap:16px}
#bannerItem .wrap{max-width:100%;overflow-x:auto;padding:6px}

/* ═══════ PANNEAU TWITCH (320 px de large) ═══════ */
.panel{
  position:relative;width:320px;padding:16px 24px 22px;
  background:
    radial-gradient(ellipse 120% 40% at 50% 0%,rgba(106,13,173,.55),transparent 70%),
    radial-gradient(ellipse 90% 30% at 50% 100%,rgba(181,23,158,.25),transparent 70%),
    linear-gradient(180deg,#170a2c,#0D0D12);
  border:2px solid var(--gold);
  box-shadow:0 0 26px rgba(106,13,173,.6);
  overflow:hidden;
}
.panel::after{content:"";position:absolute;inset:6px;border:1px solid rgba(201,162,75,.45);pointer-events:none}
.corner{position:absolute;width:9px;height:9px;background:var(--gold);transform:rotate(45deg)}
.corner.tl{left:2px;top:2px}.corner.tr{right:2px;top:2px}
.corner.bl{left:2px;bottom:2px}.corner.br{right:2px;bottom:2px}

.pHead{position:relative;display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:4px}
.pHead .gear{flex:none;display:block}
.gear{animation:spin 22s linear infinite}
.gear.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.pTitle{display:flex;align-items:center;gap:10px}
.pTitle h2{
  font-family:var(--font-title);font-weight:800;font-size:25px;letter-spacing:.1em;
  color:var(--gold-light);text-shadow:0 0 14px rgba(181,23,158,.8),0 2px 0 rgba(0,0,0,.7);
  white-space:nowrap;
}
.pDiv{position:relative;height:16px;margin:2px 0 12px}
.pDiv i{position:absolute;top:7px;height:2px;width:46%;background:linear-gradient(90deg,transparent,var(--gold))}
.pDiv i.l{left:0}
.pDiv i.r{right:0;background:linear-gradient(270deg,transparent,var(--gold))}
.pDiv b{
  position:absolute;left:50%;top:2px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);
  background:linear-gradient(135deg,var(--crystal-light),var(--violet));border:2px solid var(--gold);
  animation:gem 3.5s ease-in-out infinite;
}
@keyframes gem{0%,100%{box-shadow:0 0 5px rgba(63,169,255,.5)}50%{box-shadow:0 0 16px rgba(111,231,255,.95)}}

.pBody{font-size:18px;line-height:1.4;font-weight:500;color:var(--silver)}
.pBody p{margin-bottom:10px}
.pBody p.lead{font-family:var(--font-slogan);font-style:italic;font-size:22px;line-height:1.3;color:var(--gold-light)}
.pBody ul{list-style:none}
.pBody li{position:relative;padding-left:22px;margin-bottom:9px}
.pBody li::before{
  content:"";position:absolute;left:3px;top:.5em;width:8px;height:8px;transform:rotate(45deg);
  background:var(--crystal-light);box-shadow:0 0 8px rgba(111,231,255,.8);
}
.pBody li b{color:var(--gold-light);font-weight:700}

/* Planning */
.sched .row{display:flex;align-items:baseline;gap:10px;padding:7px 8px;border-bottom:1px solid rgba(201,162,75,.28)}
.sched .row:last-child{border-bottom:0}
.sched .day{width:92px;flex:none;font-weight:700;font-size:20px;color:var(--gold)}
.sched .time{width:54px;flex:none;font-weight:700;font-size:20px;color:var(--gold-light)}
.sched .note{font-size:16px;color:var(--silver);opacity:.9}
.sched .row.off .day,.sched .row.off .time{opacity:.45}
.sched .row.off .note{opacity:.5;font-style:italic}
.sched .row.today{background:linear-gradient(90deg,rgba(181,23,158,.38),transparent)}

/* Réseaux */
.soc .row{padding:9px 0;border-bottom:1px solid rgba(201,162,75,.28)}
.soc .row:last-child{border-bottom:0}
.soc .lab{display:block;font-size:15px;font-weight:700;letter-spacing:.2em;color:var(--gold)}
.soc .val{display:block;font-size:22px;font-weight:600;color:var(--silver);overflow-wrap:anywhere}

.pFoot{margin-top:14px;text-align:center;font-family:var(--font-title);font-weight:600;font-size:15px;letter-spacing:.22em;color:var(--gold);opacity:.85}

/* ═══════ BANNIÈRE 1200 x 480 ═══════ */
.banner{
  position:relative;width:1200px;height:480px;overflow:hidden;
  background:
    radial-gradient(ellipse 50% 90% at 24% 50%,rgba(106,13,173,.65),transparent 70%),
    radial-gradient(ellipse 45% 70% at 90% 100%,rgba(181,23,158,.35),transparent 70%),
    linear-gradient(135deg,#1b0c35,#0D0D12 70%);
  border:3px solid var(--gold);box-shadow:0 0 36px rgba(106,13,173,.6);
}
.banner::after{content:"";position:absolute;inset:10px;border:1px solid rgba(201,162,75,.5);pointer-events:none}
.banner .bGear{position:absolute;opacity:.55}
.banner .emb{position:absolute;left:30px;top:50px;width:380px;height:380px}
.banner .txt{position:absolute;left:440px;right:50px;top:96px}
.banner h2{
  font-family:var(--font-title);font-weight:800;font-size:96px;line-height:1.05;letter-spacing:.08em;
  color:var(--gold-light);text-shadow:0 0 30px rgba(181,23,158,.85),0 4px 0 rgba(0,0,0,.7);
}
.banner .sl{margin-top:8px;font-family:var(--font-slogan);font-style:italic;font-weight:500;font-size:42px;color:var(--silver);text-shadow:0 0 18px rgba(106,13,173,.9)}
.banner .bDiv{position:relative;height:18px;margin:22px 0 18px;width:520px}
.banner .bDiv i{position:absolute;top:8px;height:2px;width:240px;background:linear-gradient(90deg,transparent,var(--gold))}
.banner .bDiv i.l{left:0}.banner .bDiv i.r{right:0;background:linear-gradient(270deg,transparent,var(--gold))}
.banner .bDiv b{position:absolute;left:50%;top:2px;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:linear-gradient(135deg,var(--crystal-light),var(--violet));border:2px solid var(--gold)}
.banner .bSoc{display:flex;gap:34px;font-size:26px;font-weight:600;color:var(--silver)}
.banner .bSoc span b{color:var(--gold);font-weight:700;margin-right:10px;letter-spacing:.1em;font-size:20px}

/* Export : on fige les animations */
.exporting, .exporting *{animation:none !important}

/* ═══════ MODE OVERLAY (OBS) ═══════ */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;background:transparent}
#stage.preview{background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 40px,transparent 40px 80px),linear-gradient(135deg,#2d3a55,#161b2b)}
#slot{position:absolute;left:0;top:0;transform-origin:0 0;visibility:hidden}
</style>
</head>
<body>

<div id="gallery">
  <h1>Panneaux & bannière</h1>
  <p class="hint">Modifie tes textes dans <b>CONFIG</b> (en haut du script), puis clique sur « Télécharger » : chaque image est prête à être envoyée sur Twitch (panneaux de la chaîne et bannière).</p>
  <div id="grid"></div>
  <div id="bannerItem"></div>
</div>

<div id="stage"><div id="slot"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   2) CONFIGURATION — tes contenus
   ════════════════════════════════════════════════════════════
   USAGES
   • Panneaux Twitch : ouvre panneaux.html dans ton navigateur, clique « Télécharger »,
     puis envoie les PNG dans Twitch > Tableau de bord > Chaîne > Modifier les panneaux.
   • Overlay OBS (fond transparent) : source Navigateur 1920x1080 avec
       panneaux.html?overlay&channel=tonpseudo   → les spectateurs tapent !planning, !regles,
                                                    !apropos ou !reseaux et le panneau s'affiche
       panneaux.html?overlay&show=planning&duration=0   → affiche un panneau en permanence
     (ajoute &preview pour un faux fond de jeu)
*/
const CONFIG = {
  pseudo: "Hateo",
  slogan: "Bienvenue dans l’ombre",
  showDuration: 12,          // secondes d'affichage après une commande du chat
  cooldown: 15,              // secondes entre deux commandes
  commands: { "!apropos":"about", "!regles":"rules", "!règles":"rules", "!planning":"schedule", "!reseaux":"socials", "!réseaux":"socials" },

  about: {
    title: "À propos",
    lead: "Un VTuber venu de l’ombre, avec plus d’un tour dans son manteau.",
    paragraphs: [
      "Je stream des jeux, des discussions et des moments calmes, toujours dans la bonne humeur.",
    ],
    facts: [
      "<b>Univers :</b> dark fantasy et steampunk",
      "<b>Jeux :</b> RPG, aventure, indés",
      "<b>Langue :</b> français"
    ]
  },
  rules: {
    title: "Règles du chat",
    items: [
      "Respect avant tout : pas d’insultes, ni de harcèlement.",
      "Pas de spoil sans accord de la personne qui joue.",
      "Pas de pub ni de lien sans autorisation.",
      "Reste sur le sujet, évite le spam et les majuscules.",
      "Les modérateurs ont toujours le dernier mot."
    ]
  },
  schedule: {
    title: "Planning",
    rows: [
      { day:"Lundi",    time:"",    note:"Repos" },
      { day:"Mardi",    time:"20h", note:"Jeux" },
      { day:"Mercredi", time:"20h", note:"Discussion" },
      { day:"Jeudi",    time:"",    note:"Repos" },
      { day:"Vendredi", time:"20h", note:"Grand live" },
      { day:"Samedi",   time:"21h", note:"Jeux entre amis" },
      { day:"Dimanche", time:"",    note:"Repos" }
    ],
    footer: "Horaires de Paris"
  },
  socials: {
    title: "Réseaux",
    rows: [
      { label:"Twitter / X", value:"@Leagurof-layton" },
      { label:"Discord",     value:"https://discord.gg/WYfFMn7ptm" },
      { label:"YouTube",     value:"@LightAlpha71" },
      { label:"TikTok",      value:"@Hateo" }
    ]
  },
  banner: {
    socials: [ {label:"Twitch", value:"/Hateo"}, {label:"Discord", value:"https://discord.gg/WYfFMn7ptm"}, {label:"X", value:"@Leagueof_layton"} ]
  }
};

const params = new URLSearchParams(location.search);
if (params.get("name")) CONFIG.pseudo = params.get("name");
const OVERLAY = params.has("overlay");
if (OVERLAY) document.body.classList.add("overlay");

/* ════════════════════════════════════════════════════════════
   3) BRIQUES GRAPHIQUES (SVG autonomes, compatibles export PNG)
   ════════════════════════════════════════════════════════════ */
function gearSVG(size, teeth, reverse){
  const ro = size/2 - 2, ri = ro * .84, c = size/2, step = Math.PI*2/teeth, pts = [];
  const pol = (r, a) => [(c + r*Math.cos(a)).toFixed(1), (c + r*Math.sin(a)).toFixed(1)];
  for (let i = 0; i < teeth; i++){
    const a = i*step;
    pts.push(pol(ri, a - step*.30), pol(ro, a - step*.17), pol(ro, a + step*.17), pol(ri, a + step*.30));
  }
  let spokes = "";
  for (let i = 0; i < 6; i++){
    const a = i*Math.PI/3, p1 = pol(ri*.30, a), p2 = pol(ri*.80, a);
    spokes += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#C9A24B" stroke-opacity=".7" stroke-width="2"/>`;
  }
  return `<svg class="gear${reverse ? " rev" : ""}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">
    <path d="M${pts.map(p => p.join(",")).join("L")}Z" fill="#0e0d14" stroke="#C9A24B" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${c}" cy="${c}" r="${ri*.82}" fill="none" stroke="#C9A24B" stroke-opacity=".55" stroke-width="1.5"/>
    ${spokes}
    <circle cx="${c}" cy="${c}" r="${ri*.30}" fill="#07060c" stroke="#C9A24B" stroke-width="2"/>
    <circle cx="${c}" cy="${c}" r="${ri*.10}" fill="#C9A24B"/>
  </svg>`;
}

/* Éclipse statique (croissant + couronne) */
let uid = 0;
function eclipseSVG(size, withRays){
  const id = "e" + (++uid);
  let rays = "";
  if (withRays){
    for (let i = 0; i < 48; i++){
      const long = i % 4 === 0, len = long ? 56 + ((i*7)%26) : 14 + ((i*5)%20);
      rays += `<line transform="rotate(${(i*7.5).toFixed(1)} 220 220)" x1="220" y1="112" x2="220" y2="${112-len}" stroke="${["#F3DC9A","#F3DC9A","#D77CE8","#6FE7FF"][i%4]}" stroke-width="${long ? 3 : 1.6}" stroke-linecap="round" opacity=".85"/>`;
    }
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
    <defs>
      <radialGradient id="${id}c" cx="50%" cy="50%" r="50%">
        <stop offset=".45" stop-color="#B5179E" stop-opacity=".8"/><stop offset=".72" stop-color="#6A0DAD" stop-opacity=".3"/><stop offset="1" stop-color="#4B0082" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="${id}s" cx="40%" cy="60%" r="70%">
        <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#C9A24B"/><stop offset="1" stop-color="#B5179E"/>
      </radialGradient>
    </defs>
    <circle cx="220" cy="220" r="215" fill="url(#${id}c)"/>
    <circle cx="220" cy="220" r="176" fill="none" stroke="#C9A24B" stroke-width="7" stroke-dasharray="2 15"/>
    <circle cx="220" cy="220" r="196" fill="none" stroke="#6FE7FF" stroke-opacity=".5" stroke-width="2" stroke-dasharray="34 22 4 22"/>
    ${rays}
    <circle cx="220" cy="220" r="104" fill="url(#${id}s)"/>
    <circle cx="256" cy="206" r="100" fill="#07060c" stroke="#1a1a22" stroke-width="2"/>
  </svg>`;
}

/* ════════════════════════════════════════════════════════════
   4) CONSTRUCTION DES PANNEAUX
   ════════════════════════════════════════════════════════════ */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function shell(id, title, bodyHTML, footer, extraClass){
  const el = document.createElement("div");
  el.className = "panel"; el.id = "p-" + id;
  el.innerHTML = `
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="pHead">${gearSVG(36, 10, false)}
      <div class="pTitle">${eclipseSVG(26, false)}<h2>${esc(title)}</h2></div>
      ${gearSVG(36, 10, true)}
    </div>
    <div class="pDiv"><i class="l"></i><b></b><i class="r"></i></div>
    <div class="pBody ${extraClass || ""}">${bodyHTML}</div>
    <div class="pFoot">${esc(footer || CONFIG.pseudo)}</div>`;
  return el;
}

const BUILDERS = {
  about(){
    const c = CONFIG.about;
    return shell("about", c.title,
      `<p class="lead">${esc(c.lead)}</p>` + c.paragraphs.map(p => `<p>${esc(p)}</p>`).join("") +
      `<ul>${c.facts.map(f => `<li>${f}</li>`).join("")}</ul>`);
  },
  rules(){
    const c = CONFIG.rules;
    return shell("rules", c.title, `<ul>${c.items.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`);
  },
  schedule(){
    const c = CONFIG.schedule, today = (new Date().getDay() + 6) % 7;
    return shell("schedule", c.title,
      c.rows.map((r, i) =>
        `<div class="row${r.time ? "" : " off"}${OVERLAY && i === today ? " today" : ""}"><span class="day">${esc(r.day)}</span><span class="time">${esc(r.time)}</span><span class="note">${esc(r.note)}</span></div>`).join(""),
      c.footer, "sched");
  },
  socials(){
    const c = CONFIG.socials;
    return shell("socials", c.title,
      c.rows.map(r => `<div class="row"><span class="lab">${esc(r.label)}</span><span class="val">${esc(r.value)}</span></div>`).join(""),
      CONFIG.pseudo, "soc");
  },
  banner(){
    const el = document.createElement("div");
    el.className = "banner"; el.id = "p-banner";
    el.innerHTML = `
      <div class="bGear" style="left:-90px;bottom:-90px">${gearSVG(260, 22, false)}</div>
      <div class="bGear" style="right:-70px;top:-80px">${gearSVG(220, 20, true)}</div>
      <div class="emb">${eclipseSVG(380, true)}</div>
      <div class="txt">
        <h2>${esc(CONFIG.pseudo)}</h2>
        <div class="sl">${esc(CONFIG.slogan)}</div>
        <div class="bDiv"><i class="l"></i><b></b><i class="r"></i></div>
        <div class="bSoc">${CONFIG.banner.socials.map(s => `<span><b>${esc(s.label)}</b>${esc(s.value)}</span>`).join("")}</div>
      </div>`;
    return el;
  }
};
const LABELS = {about:"À propos", rules:"Règles", schedule:"Planning", socials:"Réseaux", banner:"Bannière"};

/* ════════════════════════════════════════════════════════════
   5) GALERIE + EXPORT PNG
   ════════════════════════════════════════════════════════════ */
async function exportPNG(el, name, scale){
  await (document.fonts && document.fonts.ready);
  el.classList.add("exporting");
  try {
    const canvas = await html2canvas(el, {scale, backgroundColor:null, useCORS:true, logging:false});
    canvas.toBlob(b => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(b); a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
    }, "image/png");
  } catch(e){ alert("L’export a échoué : " + e.message); }
  el.classList.remove("exporting");
}

function addItem(container, key, scale){
  const item = document.createElement("div"); item.className = "item";
  const el = BUILDERS[key]();
  const btn = document.createElement("button"); btn.className = "dl";
  btn.textContent = `Télécharger « ${LABELS[key]} » (PNG)`;
  btn.onclick = () => exportPNG(el, `${key}.png`, scale);
  if (key === "banner"){ const w = document.createElement("div"); w.className = "wrap"; w.appendChild(el); item.appendChild(w); }
  else item.appendChild(el);
  item.appendChild(btn); container.appendChild(item);
}

if (!OVERLAY){
  const scale = +params.get("scale") || 2;        // 2 = 640 px de large, net sur écrans HD
  ["about", "rules", "schedule", "socials"].forEach(k => addItem($("grid"), k, scale));
  addItem($("bannerItem"), "banner", 1);          // bannière native 1200 x 480
}
function $(id){ return document.getElementById(id); }

/* ════════════════════════════════════════════════════════════
   6) MODE OVERLAY : affichage animé dans OBS
   ════════════════════════════════════════════════════════════ */
const stage = $("stage"), slot = $("slot");
let current = null, hideTimer = null, lastCmd = 0;

function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}

function hidePanel(){
  return new Promise(res => {
    clearTimeout(hideTimer);
    if (!current){ return res(); }
    const el = current; current = null;
    gsap.timeline({onComplete(){ slot.style.visibility = "hidden"; slot.innerHTML = ""; res(); }})
      .to(el.querySelectorAll(".pBody > *, .pFoot"), {opacity:0, y:-10, duration:.25, stagger:.03, ease:"power2.in"})
      .to(el, {clipPath:"inset(0 50% 0 50%)", opacity:0, duration:.5, ease:"power3.in"}, "<.1");
  });
}

async function showPanel(key, duration){
  if (!BUILDERS[key]) return;
  await hidePanel();
  const el = BUILDERS[key]();
  slot.innerHTML = ""; slot.appendChild(el);

  /* mise à l'échelle pour remplir joliment l'écran */
  const w = el.offsetWidth, h = el.offsetHeight;
  const s = Math.min(1400 / w, 940 / h, 3.2);
  slot.style.transform = `translate(${(1920 - w*s)/2}px, ${(1080 - h*s)/2}px) scale(${s})`;
  slot.style.visibility = "visible";
  current = el;

  gsap.timeline({defaults:{ease:"power3.out"}})
    .fromTo(el, {clipPath:"inset(0 50% 0 50%)", opacity:0}, {clipPath:"inset(0 0% 0 0%)", opacity:1, duration:.8, ease:"power4.out"})
    .fromTo(el.querySelectorAll(".pHead, .pDiv, .pBody > *, .pFoot"), {opacity:0, y:14}, {opacity:1, y:0, duration:.55, stagger:.07}, .35);

  const d = duration == null ? CONFIG.showDuration : duration;
  if (d > 0) hideTimer = setTimeout(hidePanel, d * 1000);
}
window.Panels = { show:showPanel, hide:hidePanel };

if (OVERLAY){
  addEventListener("resize", fit); fit();
  if (params.has("preview")) stage.classList.add("preview");

  if (params.get("show")){
    const d = params.has("duration") ? +params.get("duration") : 0;
    setTimeout(() => showPanel(params.get("show"), d), 400);
  }

  /* Commandes du chat Twitch (lecture anonyme, sans mot de passe) */
  const channel = (params.get("channel") || "").toLowerCase().replace(/^#/, "");
  if (channel){
    (function connect(){
      const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
      ws.onopen = () => {
        ws.send("PASS SCHMOOCHIEPOO");
        ws.send("NICK justinfan" + Math.floor(10000 + Math.random()*89999));
        ws.send("JOIN #" + channel);
      };
      ws.onmessage = ev => ev.data.split("\r\n").filter(Boolean).forEach(line => {
        if (line.startsWith("PING")) return ws.send("PONG :tmi.twitch.tv");
        const m = line.match(/PRIVMSG #\S+ :(.*)$/); if (!m) return;
        const cmd = m[1].trim().split(/\s+/)[0].toLowerCase(), key = CONFIG.commands[cmd];
        if (!key) return;
        const now = Date.now();
        if (now - lastCmd < CONFIG.cooldown * 1000) return;
        lastCmd = now; showPanel(key);
      });
      ws.onclose = () => setTimeout(connect, 5000);
      ws.onerror = () => ws.close();
    })();
  }
}
</script>
