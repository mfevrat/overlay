<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ending / Merci – Overlay VTuber</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@1,500&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════════════════
   1) VARIABLES — change tes couleurs ici
   ════════════════════════════════════════════════════════════ */
:root{
  --violet-deep:#4B0082;
  --violet:#6A0DAD;
  --magenta:#B5179E;
  --charcoal:#0D0D12;
  --charcoal-2:#1A1A22;
  --gold:#C9A24B;
  --gold-light:#F3DC9A;
  --crystal:#3FA9FF;
  --crystal-light:#6FE7FF;
  --crimson:#D6204E;
  --silver:#D9D9E3;

  --font-title:'Cinzel','Times New Roman',serif;
  --font-slogan:'Cormorant Garamond',Georgia,serif;
  --font-ui:'Rajdhani','Segoe UI',sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}

#stage{
  position:absolute;left:50%;top:50%;
  width:1920px;height:1080px;
  transform-origin:center center;
  background:radial-gradient(ellipse 60% 55% at 50% 36%, #2b0a4a 0%, #150a26 45%, var(--charcoal) 100%);
  overflow:hidden;
}
#grain{
  position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;z-index:50;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
}
#vignette{
  position:absolute;inset:0;pointer-events:none;z-index:40;
  background:radial-gradient(ellipse 75% 75% at 50% 50%, transparent 55%, rgba(5,3,10,.85) 100%);
}

/* ── Brume ── */
.mist{position:absolute;width:1300px;height:900px;border-radius:50%;pointer-events:none;will-change:transform;z-index:1}
.mist.m1{left:-300px;top:380px;background:radial-gradient(closest-side, rgba(106,13,173,.36), transparent);animation:drift1 44s ease-in-out infinite alternate}
.mist.m2{right:-350px;top:120px;background:radial-gradient(closest-side, rgba(181,23,158,.26), transparent);animation:drift2 52s ease-in-out infinite alternate}
.mist.m3{left:300px;bottom:-420px;width:1500px;background:radial-gradient(closest-side, rgba(201,162,75,.12), transparent);animation:drift3 60s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(260px,-90px) scale(1.15)}}
@keyframes drift2{to{transform:translate(-300px,140px) scale(.9)}}
@keyframes drift3{to{transform:translate(-220px,-70px) scale(1.2)}}

canvas#particles{position:absolute;inset:0;z-index:3;pointer-events:none}

/* ── Rouages ── */
#gears{position:absolute;inset:0;z-index:2}
.gearWrap{position:absolute}
.gearWrap svg{display:block;animation:spin var(--dur,60s) linear infinite;will-change:transform}
.gearWrap.rev svg{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}

#main{position:absolute;inset:0;z-index:10}
#main.withVtuber{transform:translateX(-300px)}

/* ── Éclipse totale (élément signature) ── */
#eclipse{position:absolute;left:740px;top:70px;width:440px;height:440px}
#eclipse svg{width:100%;height:100%;overflow:visible}
.coronaPulse{transform-origin:220px 220px;animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.95);opacity:.85}50%{transform:scale(1.05);opacity:1}}
.ringA{transform-origin:220px 220px;animation:spin 100s linear infinite}
.ringB{transform-origin:220px 220px;animation:spin 70s linear infinite reverse}
.raysSpin{transform-origin:220px 220px;animation:spin 140s linear infinite}
.ray{animation:rayPulse 6s ease-in-out infinite}
@keyframes rayPulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ── Titre ── */
#titleWrap{position:absolute;left:0;width:1920px;top:520px;text-align:center;letter-spacing:.1em}
#titleWrap h1{font-family:var(--font-title);font-weight:800;font-size:106px;line-height:1.15;white-space:nowrap}
#titleWrap h1.main{
  position:relative;
  background:linear-gradient(100deg,#8a6a22 0%,var(--gold) 25%,var(--gold-light) 45%,var(--gold) 60%,#8a6a22 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 22px rgba(181,23,158,.55)) drop-shadow(0 4px 0 rgba(0,0,0,.6));
  animation:shine 7s linear infinite;
}
@keyframes shine{from{background-position:120% 0}to{background-position:-100% 0}}
#titleWrap h1.ghost{position:absolute;left:0;right:0;top:0;opacity:0;mix-blend-mode:screen;pointer-events:none}
#titleWrap h1.ghost.c{color:var(--crystal-light);-webkit-text-fill-color:var(--crystal-light)}
#titleWrap h1.ghost.r{color:var(--crimson);-webkit-text-fill-color:var(--crimson)}

#slogan{
  position:absolute;left:0;width:1920px;top:668px;text-align:center;
  font-family:var(--font-slogan);font-style:italic;font-weight:500;font-size:42px;
  letter-spacing:.06em;color:var(--silver);text-shadow:0 0 18px rgba(106,13,173,.9);
}

/* ── Prochain live ── */
#nextStream{
  position:absolute;left:0;width:1920px;top:748px;text-align:center;
  font-family:var(--font-ui);font-weight:600;font-size:38px;letter-spacing:.1em;
}
#nextStream .lab{color:var(--gold);margin-right:22px}
#nextStream .val{color:var(--gold-light);text-shadow:0 0 14px rgba(111,231,255,.55)}

/* ── Séparateur ── */
#divider{position:absolute;left:560px;top:812px;width:800px;height:24px}
#divider .line{position:absolute;top:11px;height:2px;width:350px;background:linear-gradient(90deg,transparent,var(--gold))}
#divider .line.l{left:0}
#divider .line.r{right:0;transform:scaleX(-1)}
#divider .gem{
  position:absolute;left:388px;top:2px;width:20px;height:20px;
  background:linear-gradient(135deg,var(--crystal-light),var(--violet));
  border:2px solid var(--gold);transform:rotate(45deg);animation:gem 3.5s ease-in-out infinite;
}
@keyframes gem{0%,100%{box-shadow:0 0 8px rgba(63,169,255,.5)}50%{box-shadow:0 0 26px rgba(111,231,255,.95)}}
#divider .line::after{
  content:"";position:absolute;inset:-1px 0;
  background:linear-gradient(90deg,transparent 40%,rgba(255,255,255,.8) 50%,transparent 60%);
  background-size:300% 100%;animation:sweep 5s linear infinite;
}
@keyframes sweep{from{background-position:200% 0}to{background-position:-100% 0}}

/* ── Remerciements (rotation) ── */
#supporters{
  position:absolute;left:0;width:1920px;top:846px;height:56px;text-align:center;
  font-family:var(--font-slogan);font-style:italic;font-weight:500;font-size:40px;letter-spacing:.05em;
}
#supporters span{display:inline-block}
#supporters .lab{color:var(--silver);margin-right:16px}
#supporters .val{color:var(--gold-light);text-shadow:0 0 16px rgba(181,23,158,.8)}

/* ── Réseaux (tous visibles) ── */
#socials{
  position:absolute;left:0;width:1920px;top:925px;height:90px;
  display:flex;justify-content:center;gap:60px;font-family:var(--font-ui);
}
.soc{position:relative;text-align:center}
.soc+.soc::before{content:"";position:absolute;left:-30px;top:6px;width:1px;height:62px;background:linear-gradient(transparent,var(--gold),transparent)}
.soc .lab{display:block;color:var(--gold);font-size:22px;font-weight:600;letter-spacing:.16em;margin-bottom:4px}
.soc .val{display:block;color:var(--silver);font-size:30px;font-weight:600;letter-spacing:.06em}

/* ── Cadre ── */
#frame{position:absolute;inset:0;z-index:20;pointer-events:none}
#frame path.draw{stroke-dasharray:1;stroke-dashoffset:0}

/* ── VTuber (optionnel) ── */
#vtWrap{
  position:absolute;right:50px;bottom:0;height:960px;z-index:15;display:none;
  transform-origin:50% 100%;animation:breathe 5s ease-in-out infinite;
}
#vtWrap img{height:100%;display:block;filter:drop-shadow(0 0 30px rgba(106,13,173,.7))}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.012)}}
#main.withVtuber #socials{gap:44px;transform:scale(.88)}

#flash{
  position:absolute;inset:0;z-index:60;opacity:0;pointer-events:none;
  background:radial-gradient(circle at 50% 30%, #fff 0%, #c58bff 30%, transparent 70%);
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DC9A"/>
      <stop offset=".5" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#7a5a1c"/>
    </linearGradient>
  </defs>
</svg>

<div id="stage">
  <div class="mist m1"></div>
  <div class="mist m2"></div>
  <div class="mist m3"></div>

  <div id="gears"></div>
  <canvas id="particles" width="1920" height="1080"></canvas>

  <div id="main">

    <!-- ÉCLIPSE TOTALE : le disque sombre glisse jusqu'à couvrir le soleil, puis la couronne jaillit.
         Pour ajouter ton logo PNG au centre : <image href="logo.png" x="150" y="150" width="140" height="140"/> -->
    <div id="eclipse">
      <svg viewBox="0 0 440 440">
        <defs>
          <radialGradient id="corona" cx="50%" cy="50%" r="50%">
            <stop offset="0.45" stop-color="#F3DC9A" stop-opacity=".9"/>
            <stop offset="0.55" stop-color="#B5179E" stop-opacity=".55"/>
            <stop offset="0.75" stop-color="#6A0DAD" stop-opacity=".22"/>
            <stop offset="1" stop-color="#4B0082" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="sun" cx="40%" cy="60%" r="70%">
            <stop offset="0" stop-color="#fff3c4"/>
            <stop offset=".45" stop-color="#C9A24B"/>
            <stop offset="1" stop-color="#B5179E"/>
          </radialGradient>
          <filter id="blur10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
          <filter id="blur4" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
        </defs>

        <!-- Lueur de couronne : apparaît au moment de la totalité -->
        <g id="coronaGlow" opacity="0">
          <circle class="coronaPulse" cx="220" cy="220" r="215" fill="url(#corona)"/>
        </g>

        <g class="ringB">
          <circle cx="220" cy="220" r="196" fill="none" stroke="#6FE7FF" stroke-opacity=".5" stroke-width="2" stroke-dasharray="34 22 4 22"/>
        </g>
        <g class="ringA">
          <circle cx="220" cy="220" r="176" fill="none" stroke="#C9A24B" stroke-width="7" stroke-dasharray="2 15"/>
          <circle cx="220" cy="220" r="166" fill="none" stroke="#C9A24B" stroke-opacity=".6" stroke-width="1.2"/>
        </g>

        <!-- Rayons de couronne -->
        <g id="rays" opacity="0"><g class="raysSpin" id="raysSpin"></g></g>

        <circle cx="220" cy="220" r="108" fill="#B5179E" opacity=".65" filter="url(#blur10)"/>
        <circle cx="220" cy="220" r="104" fill="url(#sun)"/>
        <!-- Disque sombre (animé par GSAP) -->
        <circle id="moonShade" cx="220" cy="220" r="102.6" fill="#07060c" stroke="#1a1a22" stroke-width="1.5"/>

        <!-- Anneau de diamant -->
        <g transform="translate(123 257)">
          <g id="dRing" opacity="0">
            <circle r="16" fill="#fff" opacity=".85" filter="url(#blur4)"/>
            <polygon points="0,-34 5,-5 34,0 5,5 0,34 -5,5 -34,0 -5,-5" fill="#fff"/>
          </g>
        </g>
        <circle id="burst" cx="220" cy="220" r="104" fill="none" stroke="#F3DC9A" stroke-width="4" opacity="0"/>
      </svg>
    </div>

    <div id="titleWrap">
      <h1 class="ghost r" aria-hidden="true"></h1>
      <h1 class="ghost c" aria-hidden="true"></h1>
      <h1 class="main"></h1>
    </div>

    <div id="slogan"></div>
    <div id="nextStream"></div>
    <div id="divider"><div class="line l"></div><div class="gem"></div><div class="line r"></div></div>
    <div id="supporters"></div>
    <div id="socials"></div>
  </div>

  <div id="vtWrap"><img id="vtuber" alt=""></div>

  <svg id="frame" viewBox="0 0 1920 1080">
    <rect x="30" y="30" width="1860" height="1020" fill="none" stroke="#C9A24B" stroke-opacity=".28" stroke-width="1.5"/>
    <g fill="none" stroke="#C9A24B" stroke-width="4" stroke-linecap="square">
      <path class="draw" pathLength="1" d="M30 130 V30 H130"/>
      <path class="draw" pathLength="1" d="M1790 30 H1890 V130"/>
      <path class="draw" pathLength="1" d="M30 950 V1050 H130"/>
      <path class="draw" pathLength="1" d="M1890 950 V1050 H1790"/>
    </g>
    <g fill="#C9A24B">
      <rect x="22" y="22" width="16" height="16" transform="rotate(45 30 30)"/>
      <rect x="1882" y="22" width="16" height="16" transform="rotate(45 1890 30)"/>
      <rect x="22" y="1042" width="16" height="16" transform="rotate(45 30 1050)"/>
      <rect x="1882" y="1042" width="16" height="16" transform="rotate(45 1890 1050)"/>
    </g>
  </svg>

  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="flash"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   2) CONFIGURATION — modifie tes textes ici
   ════════════════════════════════════════════════════════════
   Paramètres d'URL (optionnels) :
     ?name=MonPseudo
     ?next=Vendredi%20à%2020h      → texte du prochain live
*/
const CONFIG = {
  pseudo:  "TonPseudo",
  title:   "Merci d’être là",
  slogan:  "L’ombre te salue. À très vite !",
  nextLabel: "Prochain live",
  nextValue: "Vendredi à 20h",
  supportersLabel: "Un grand merci à",
  supporters: ["Pseudo1", "Pseudo2", "Pseudo3", "Pseudo4"],   // vide [] = ligne masquée
  supportersInterval: 3.2,
  vtuberImage: "",                  // ex : "vtuber.png" (PNG transparent)
  socials: [
    { label: "Twitter / X", value: "@TonPseudo" },
    { label: "Discord",     value: "discord.gg/tonlien" },
    { label: "YouTube",     value: "@TonPseudo" },
    { label: "TikTok",      value: "@TonPseudo" }
  ]
};

const params = new URLSearchParams(location.search);
if (params.get("name")) CONFIG.pseudo = params.get("name");
if (params.get("next")) CONFIG.nextValue = params.get("next");

/* ════════════════════════════════════════════════════════════
   3) MISE À L'ÉCHELLE
   ════════════════════════════════════════════════════════════ */
const stage = document.getElementById("stage");
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

/* ════════════════════════════════════════════════════════════
   4) TEXTES
   ════════════════════════════════════════════════════════════ */
document.querySelectorAll("#titleWrap h1").forEach(h => h.textContent = CONFIG.title);
document.getElementById("slogan").textContent = CONFIG.slogan;
document.getElementById("nextStream").innerHTML =
  `<span class="lab">${CONFIG.nextLabel}</span><span class="val">${CONFIG.nextValue}</span>`;
document.getElementById("socials").innerHTML = CONFIG.socials
  .map(s => `<div class="soc"><span class="lab">${s.label}</span><span class="val">${s.value}</span></div>`).join("");

/* ════════════════════════════════════════════════════════════
   5) ROUAGES
   ════════════════════════════════════════════════════════════ */
function makeGear(cx, cy, teeth, ro, ri, durSec, reverse, opacity){
  const size = (ro + 8) * 2, c = size / 2, step = Math.PI * 2 / teeth;
  const pol = (r, a) => [(c + r*Math.cos(a)).toFixed(1), (c + r*Math.sin(a)).toFixed(1)];
  const pts = [];
  for (let i = 0; i < teeth; i++){
    const a = i * step;
    pts.push(pol(ri, a - step*.30), pol(ro, a - step*.17), pol(ro, a + step*.17), pol(ri, a + step*.30));
  }
  const d = "M" + pts.map(p => p.join(",")).join("L") + "Z";
  let spokes = "";
  for (let i = 0; i < 6; i++){
    const a = i * Math.PI / 3, p1 = pol(ri*.30, a), p2 = pol(ri*.80, a);
    spokes += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#C9A24B" stroke-opacity=".7" stroke-width="${Math.max(3, ri*.05)}"/>`;
  }
  const wrap = document.createElement("div");
  wrap.className = "gearWrap" + (reverse ? " rev" : "");
  wrap.style.cssText = `left:${cx-size/2}px;top:${cy-size/2}px;width:${size}px;height:${size}px;opacity:${opacity};--dur:${durSec}s`;
  wrap.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <path d="${d}" fill="#0e0d14" stroke="url(#goldG)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="${c}" cy="${c}" r="${ri*.86}" fill="none" stroke="#C9A24B" stroke-opacity=".55" stroke-width="2"/>
    ${spokes}
    <circle cx="${c}" cy="${c}" r="${ri*.30}" fill="#07060c" stroke="url(#goldG)" stroke-width="3"/>
    <circle cx="${c}" cy="${c}" r="${ri*.10}" fill="#C9A24B"/>
  </svg>`;
  document.getElementById("gears").appendChild(wrap);
}
makeGear(140,  940, 24, 190, 165, 130, false, .8);
makeGear(330,  722, 14, 112,  94,  76, true,  .8);
makeGear(1780, 940, 24, 190, 165, 130, true,  .8);
makeGear(1590, 722, 14, 112,  94,  76, false, .8);
makeGear(40,    60, 18, 120, 102, 100, false, .5);
makeGear(1880,  60, 18, 120, 102, 100, true,  .5);

/* ════════════════════════════════════════════════════════════
   6) RAYONS DE LA COURONNE
   ════════════════════════════════════════════════════════════ */
(function buildRays(){
  const g = document.getElementById("raysSpin");
  const n = 72, colors = ["#F3DC9A", "#F3DC9A", "#D77CE8", "#6FE7FF"];
  for (let i = 0; i < n; i++){
    const a = (i / n) * 360 + Math.random()*3;
    const long = i % 6 === 0;
    const len = long ? 58 + Math.random()*34 : 14 + Math.random()*30;
    g.insertAdjacentHTML("beforeend",
      `<line class="ray" style="animation-delay:${(Math.random()*6).toFixed(2)}s"
        transform="rotate(${a.toFixed(1)} 220 220)"
        x1="220" y1="${220-108}" x2="220" y2="${(220-108-len).toFixed(1)}"
        stroke="${colors[i % colors.length]}" stroke-width="${long ? 3 : 1.6}" stroke-linecap="round"/>`);
  }
})();

/* ════════════════════════════════════════════════════════════
   7) PARTICULES (braises dorées et violettes)
   ════════════════════════════════════════════════════════════ */
(function particles(){
  const cv = document.getElementById("particles"), ctx = cv.getContext("2d");
  function sprite(rgb){
    const s = document.createElement("canvas"); s.width = s.height = 48;
    const g = s.getContext("2d"), grd = g.createRadialGradient(24,24,0,24,24,24);
    grd.addColorStop(0, `rgba(${rgb},1)`); grd.addColorStop(.25, `rgba(${rgb},.55)`); grd.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grd; g.fillRect(0,0,48,48); return s;
  }
  const sprites = [sprite("243,220,154"), sprite("243,220,154"), sprite("181,23,158"), sprite("111,231,255"), sprite("150,60,230")];
  const P = [], rand = (a,b) => a + Math.random()*(b-a);
  function spawn(p, initial){
    p.x = rand(0,1920); p.y = initial ? rand(0,1080) : 1100;
    p.s = rand(6,20); p.v = rand(12,42); p.sw = rand(12,45); p.ph = rand(0,6.28);
    p.sp = rand(.3,.9); p.t = sprites[(Math.random()*sprites.length)|0]; p.a = rand(.35,.9);
    return p;
  }
  for (let i = 0; i < 75; i++) P.push(spawn({}, true));
  let last = performance.now();
  (function loop(now){
    const dt = Math.min(.05, (now - last)/1000); last = now;
    ctx.clearRect(0,0,1920,1080);
    for (const p of P){
      p.y -= p.v*dt; p.ph += p.sp*dt;
      if (p.y < -40) spawn(p, false);
      ctx.globalAlpha = p.a * (.6 + .4*Math.sin(p.ph*3));
      ctx.drawImage(p.t, p.x + Math.sin(p.ph)*p.sw - p.s, p.y - p.s, p.s*2, p.s*2);
    }
    requestAnimationFrame(loop);
  })(last);
})();

/* ════════════════════════════════════════════════════════════
   8) VTUBER (optionnel)
   ════════════════════════════════════════════════════════════ */
if (CONFIG.vtuberImage){
  document.getElementById("vtuber").src = CONFIG.vtuberImage;
  document.getElementById("vtWrap").style.display = "block";
  document.getElementById("main").classList.add("withVtuber");
}

/* ════════════════════════════════════════════════════════════
   9) REMERCIEMENTS (rotation)
   ════════════════════════════════════════════════════════════ */
const supEl = document.getElementById("supporters");
let supIdx = 0;
function showSupporter(){
  const name = CONFIG.supporters[supIdx % CONFIG.supporters.length]; supIdx++;
  supEl.innerHTML = `<span class="lab">${CONFIG.supportersLabel}</span><span class="val">${name}</span>`;
  gsap.fromTo(supEl.children, {opacity:0, y:12}, {opacity:1, y:0, duration:.6, stagger:.1, ease:"power2.out"});
  gsap.to(supEl.children, {opacity:0, y:-8, duration:.5, delay:CONFIG.supportersInterval - .5, ease:"power1.in"});
}

/* ════════════════════════════════════════════════════════════
   10) GLITCH DU TITRE (rare et discret)
   ════════════════════════════════════════════════════════════ */
function glitch(){
  const r = document.querySelector("#titleWrap .ghost.r"), c = document.querySelector("#titleWrap .ghost.c");
  gsap.timeline({onComplete(){ gsap.delayedCall(gsap.utils.random(7, 12), glitch); }})
    .set([r, c], {opacity:.8})
    .to(r, {x:-8, duration:.05}).to(c, {x:8, duration:.05}, "<")
    .to(r, {x:4, duration:.04}).to(c, {x:-3, duration:.04}, "<")
    .set([r, c], {opacity:0, x:0});
}

/* ════════════════════════════════════════════════════════════
   11) SÉQUENCE : l'éclipse devient totale, la couronne jaillit
   ════════════════════════════════════════════════════════════ */
const hasSupporters = CONFIG.supporters.length > 0;
if (!hasSupporters) supEl.style.display = "none";

const tl = gsap.timeline({defaults:{ease:"power3.out"}, onComplete(){
  if (hasSupporters){ showSupporter(); setInterval(showSupporter, CONFIG.supportersInterval * 1000); }
  gsap.delayedCall(4, glitch);
  /* Après la totalité, une fine bordure dorée respire autour du disque */
  gsap.to("#moonShade", {x:3.5, y:-1.4, duration:9, yoyo:true, repeat:-1, ease:"sine.inOut"});
}});

tl.from("#frame path.draw", {strokeDashoffset:1, duration:1.6, ease:"power2.inOut", stagger:.1}, 0)
  .from("#frame rect", {opacity:0, duration:.8}, .8)
  .from(".gearWrap", {opacity:0, scale:.6, duration:1.4, stagger:.12}, .2)
  .from("#eclipse", {opacity:0, scale:.6, duration:1.6, ease:"back.out(1.3)"}, .3)

  /* Le disque sombre avance : croissant → totalité */
  .fromTo("#moonShade", {x:40, y:-16}, {x:0, y:0, duration:3.3, ease:"power2.inOut"}, 0.9)

  /* Texte pendant que l'éclipse progresse */
  .fromTo("#titleWrap", {opacity:0, letterSpacing:"0.5em", filter:"blur(14px)"},
                        {opacity:1, letterSpacing:"0.1em", filter:"blur(0px)", duration:1.5, clearProps:"filter"}, 1.8)
  .from("#slogan", {opacity:0, y:16, duration:.9}, 2.5)
  .from("#nextStream", {opacity:0, y:14, duration:.8}, 2.9)
  .from("#divider", {opacity:0, scaleX:.3, duration:.9}, 3.1)
  .from("#supporters", {opacity:0, duration:.8}, 3.3)
  .from(".soc", {opacity:0, y:18, duration:.8, stagger:.12}, 3.5)
  .from("#vtWrap", {opacity:0, x:200, duration:1.4}, 1.0)

  /* Anneau de diamant juste avant la totalité */
  .fromTo("#dRing", {opacity:0, scale:.2}, {opacity:1, scale:1, duration:.35, ease:"power2.out"}, 3.85)
  .to("#dRing", {opacity:0, scale:.4, duration:.5, ease:"power2.in"}, 4.2)

  /* Totalité : la couronne jaillit */
  .fromTo("#burst", {opacity:.9, scale:1, svgOrigin:"220 220"}, {opacity:0, scale:2.1, svgOrigin:"220 220", duration:1.7, ease:"power2.out"}, 4.15)
  .fromTo("#rays", {opacity:0, scale:.7, svgOrigin:"220 220"}, {opacity:1, scale:1, svgOrigin:"220 220", duration:1.6, ease:"power3.out"}, 4.15)
  .to("#coronaGlow", {opacity:1, duration:1.4}, 4.15)
  .to("#flash", {opacity:.4, duration:.12}, 4.15)
  .to("#flash", {opacity:0, duration:1.2, ease:"power2.out"}, 4.27);
</script>
