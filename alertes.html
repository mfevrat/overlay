<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Alertes – Overlay VTuber</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Cormorant+Garamond:ital,wght@1,500&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/* ════════════════════════════════════════════════════════════
   1) VARIABLES
   ════════════════════════════════════════════════════════════ */
:root{
  --violet-deep:#4B0082; --violet:#6A0DAD; --magenta:#B5179E;
  --charcoal:#0D0D12;
  --gold:#C9A24B; --gold-light:#F3DC9A;
  --crystal:#3FA9FF; --crystal-light:#6FE7FF;
  --crimson:#D6204E; --silver:#D9D9E3;
  --font-title:'Cinzel','Times New Roman',serif;
  --font-slogan:'Cormorant Garamond',Georgia,serif;
  --font-ui:'Rajdhani','Segoe UI',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}

/* Fond TRANSPARENT */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;background:transparent}
#stage.preview{
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 40px,transparent 40px 80px),linear-gradient(135deg,#2d3a55,#161b2b);
}

/* Flash violet global */
#flash{
  position:absolute;inset:0;opacity:0;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 50% 22%, rgba(220,180,255,.95) 0%, rgba(106,13,173,.45) 38%, transparent 70%);
}

/* ═══════ BLOC D'ALERTE (centré en haut) ═══════ */
#alert{
  position:absolute;left:510px;top:70px;width:900px;visibility:hidden;z-index:5;
  --accent:#6FE7FF; --accent2:#3FA9FF; --accentA:rgba(111,231,255,.55);
}
#aGlow{
  position:absolute;left:100px;top:-40px;width:700px;height:560px;pointer-events:none;
  background:radial-gradient(closest-side, var(--accentA), transparent);opacity:.0;
}

/* Emblème : éclipse qui s'ouvre */
#emblem{position:absolute;left:300px;top:0;width:300px;height:300px;z-index:6;pointer-events:none}
#emblem svg{width:100%;height:100%;overflow:visible}
.coronaPulse{transform-origin:220px 220px;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.95);opacity:.85}50%{transform:scale(1.07);opacity:1}}
.ringA{transform-origin:220px 220px;animation:spin 40s linear infinite}
.ringB{transform-origin:220px 220px;animation:spin 28s linear infinite reverse}
.raysSpin{transform-origin:220px 220px;animation:spin 60s linear infinite}
.aRay{stroke:var(--accent);animation:rayPulse 3.5s ease-in-out infinite}
@keyframes rayPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* Carte */
#card{position:absolute;left:10px;top:196px;width:880px;z-index:4;padding:58px 44px 32px;text-align:center}
.cardBg{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(28,12,52,.93),rgba(10,8,16,.95));
  border:3px solid transparent;
  border-image:linear-gradient(135deg,#F3DC9A,#C9A24B 40%,#7a5a1c 62%,#C9A24B) 1;
  box-shadow:0 0 46px 4px var(--accentA), inset 0 0 50px rgba(75,0,130,.35);
}
.cardBg::after{content:"";position:absolute;inset:8px;border:1px solid var(--accent);opacity:.45}
.cardBg::before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
}
.corner{position:absolute;width:16px;height:16px;background:var(--charcoal);border:2px solid var(--gold);transform:rotate(45deg);z-index:3}
.corner.tl{left:-10px;top:-10px}.corner.tr{right:-10px;top:-10px}
.corner.bl{left:-10px;bottom:-10px}.corner.br{right:-10px;bottom:-10px}

#card .t{position:relative;z-index:2}
.label{
  font-family:var(--font-ui);font-weight:700;font-size:28px;letter-spacing:.3em;
  color:var(--accent);text-shadow:0 0 16px var(--accentA);
}
.name{
  display:inline-block;margin-top:2px;white-space:nowrap;
  font-family:var(--font-title);font-weight:800;font-size:68px;line-height:1.2;letter-spacing:.08em;
  background:linear-gradient(100deg,#8a6a22 0%,var(--gold) 25%,var(--gold-light) 45%,var(--gold) 60%,#8a6a22 100%);
  background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 0 20px var(--accentA)) drop-shadow(0 4px 0 rgba(0,0,0,.6));
  animation:shine 5s linear infinite;
}
@keyframes shine{from{background-position:120% 0}to{background-position:-100% 0}}
.detail{
  margin-top:2px;font-family:var(--font-ui);font-weight:600;font-size:36px;letter-spacing:.08em;
  color:var(--silver);text-shadow:0 0 18px var(--accentA);
}
.detail b{color:var(--gold-light);font-weight:700}
.msg{
  margin:14px auto 0;max-width:760px;font-family:var(--font-slogan);font-style:italic;font-weight:500;font-size:32px;line-height:1.25;
  color:var(--silver);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* Rouages latéraux */
.gearWrap{position:absolute;z-index:3}
.gearWrap svg{display:block}

/* Éclats / étincelles */
#sparks{position:absolute;left:450px;top:150px;width:0;height:0;z-index:7;pointer-events:none}
#sparks .spark{position:absolute;left:-4px;top:-4px;width:8px;height:8px}
#sparks .shard{
  position:absolute;left:-7px;top:-54px;width:14px;height:54px;transform-origin:50% 100%;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:linear-gradient(to top,transparent,var(--accent2) 45%,#fff);
}

/* Panneau de test (?test) */
#testPanel{
  position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;
  font-family:var(--font-ui);
}
#testPanel button{
  font:600 18px var(--font-ui);letter-spacing:.06em;color:var(--gold-light);cursor:pointer;
  background:#1a0f30;border:2px solid var(--gold);padding:8px 16px;
}
#testPanel button:hover{background:#2b1650}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DC9A"/><stop offset=".5" stop-color="#C9A24B"/><stop offset="1" stop-color="#7a5a1c"/>
    </linearGradient>
  </defs>
</svg>

<div id="stage">
  <div id="flash"></div>

  <div id="alert">
    <div id="aGlow"></div>

    <!-- Éclipse qui s'ouvre -->
    <div id="emblem">
      <svg viewBox="0 0 440 440">
        <defs>
          <radialGradient id="aCorona" cx="50%" cy="50%" r="50%">
            <stop offset="0.45" style="stop-color:var(--accent)" stop-opacity=".85"/>
            <stop offset="0.7" style="stop-color:var(--accent2)" stop-opacity=".28"/>
            <stop offset="1" style="stop-color:var(--violet-deep)" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="aSun" cx="40%" cy="60%" r="70%">
            <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#C9A24B"/><stop offset="1" stop-color="#B5179E"/>
          </radialGradient>
          <filter id="aBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
        </defs>
        <circle class="coronaPulse" cx="220" cy="220" r="215" fill="url(#aCorona)"/>
        <g class="ringB"><circle cx="220" cy="220" r="150" fill="none" stroke-width="2" stroke-dasharray="30 20 4 20" style="stroke:var(--accent)" stroke-opacity=".6"/></g>
        <g class="ringA"><circle cx="220" cy="220" r="132" fill="none" stroke="#C9A24B" stroke-width="6" stroke-dasharray="2 12"/></g>
        <g class="raysSpin" id="aRays"></g>
        <circle cx="220" cy="220" r="108" style="fill:var(--accent)" opacity=".55" filter="url(#aBlur)"/>
        <circle cx="220" cy="220" r="104" fill="url(#aSun)"/>
        <circle id="aShade" cx="220" cy="220" r="102.6" fill="#07060c" stroke="#1a1a22" stroke-width="1.5"/>
        <circle id="aBurst" cx="220" cy="220" r="104" fill="none" stroke-width="4" style="stroke:var(--accent)" opacity="0"/>
      </svg>
    </div>

    <div id="card">
      <div class="cardBg" id="cardBg"></div>
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="t label" id="aLabel"></div>
      <div class="t"><div class="name" id="aName"></div></div>
      <div class="t detail" id="aDetail"></div>
      <div class="t msg" id="aMsg"></div>
    </div>

    <div id="sparks"></div>
  </div>
</div>

<div id="testPanel" style="display:none"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ════════════════════════════════════════════════════════════
   2) CONFIGURATION DES ALERTES
   ════════════════════════════════════════════════════════════
   Tokens de texte disponibles : {name} {amount} {months} {tier} {message}
   Pour ajouter un son : sound: "sons/follow.mp3" (fichier dans le même dossier).

   SOURCES D'ÉVÉNEMENTS (paramètres d'URL, combinables) :
     ?channel=tonpseudo   → Twitch (sans mot de passe) : sub, resub, sub offerts, raids, bits
     ?se=TON_JWT          → StreamElements : follow, sub, dons, bits, raids
     ?sl=TON_SOCKET_TOKEN → Streamlabs : follow, sub, dons, bits, raids
     ?test                → affiche des boutons pour tester chaque alerte
     ?preview             → faux fond de jeu (test dans un navigateur)
   Les doublons (même événement reçu par 2 sources en moins de 8 s) sont ignorés.
*/
const CONFIG = {
  volume: 0.5,
  synthSound: false,          // true = petit carillon généré (si aucun fichier son)
  gap: 0.8,                   // pause entre deux alertes (secondes)
  currency: "EUR",
  alerts: {
    follow:   { label:"Nouveau follower", detail:"Bienvenue dans l’ombre",            color:"#6FE7FF", color2:"#3FA9FF", duration:6, sound:"" },
    sub:      { label:"Nouvel abonné",    detail:"Abonnement {tier}",                  color:"#D77CE8", color2:"#B5179E", duration:7, sound:"" },
    resub:    { label:"Réabonnement",     detail:"{months} mois d’affilée",            color:"#D77CE8", color2:"#B5179E", duration:7, sound:"" },
    gift:     { label:"Sub offert",       detail:"offre {amount} abonnement(s)",       color:"#F3DC9A", color2:"#B5179E", duration:7, sound:"" },
    donation: { label:"Don",              detail:"<b>{amount}</b>",                    color:"#F3DC9A", color2:"#C9A24B", duration:8, sound:"" },
    raid:     { label:"Raid !",           detail:"<b>{amount}</b> viewers débarquent", color:"#FF4D78", color2:"#D6204E", duration:8, sound:"" },
    bits:     { label:"Bits",             detail:"<b>{amount}</b> bits",               color:"#A98BFF", color2:"#6FE7FF", duration:7, sound:"" }
  }
};

const params = new URLSearchParams(location.search);

/* ════════════════════════════════════════════════════════════
   3) MISE À L'ÉCHELLE
   ════════════════════════════════════════════════════════════ */
const stage = document.getElementById("stage");
if (params.has("preview")) stage.classList.add("preview");
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
}
addEventListener("resize", fit); fit();

/* ════════════════════════════════════════════════════════════
   4) DÉCOR : rayons de l'éclipse + rouages latéraux
   ════════════════════════════════════════════════════════════ */
(function rays(){
  const g = document.getElementById("aRays");
  for (let i = 0; i < 48; i++){
    const a = (i / 48) * 360, long = i % 4 === 0, len = long ? 52 + Math.random()*26 : 14 + Math.random()*22;
    g.insertAdjacentHTML("beforeend",
      `<line class="aRay" style="animation-delay:${(Math.random()*3.5).toFixed(2)}s" transform="rotate(${a.toFixed(1)} 220 220)"
        x1="220" y1="${220-110}" x2="220" y2="${(220-110-len).toFixed(1)}" stroke-width="${long ? 3 : 1.6}" stroke-linecap="round"/>`);
  }
})();

const gears = [];
function makeGear(cx, cy, teeth, ro, ri, dur, reverse){
  const size = (ro + 8) * 2, c = size / 2, step = Math.PI * 2 / teeth;
  const pol = (r, a) => [(c + r*Math.cos(a)).toFixed(1), (c + r*Math.sin(a)).toFixed(1)];
  const pts = [];
  for (let i = 0; i < teeth; i++){
    const a = i * step;
    pts.push(pol(ri, a - step*.30), pol(ro, a - step*.17), pol(ro, a + step*.17), pol(ri, a + step*.30));
  }
  let spokes = "";
  for (let i = 0; i < 6; i++){
    const a = i * Math.PI / 3, p1 = pol(ri*.30, a), p2 = pol(ri*.80, a);
    spokes += `<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="#C9A24B" stroke-opacity=".7" stroke-width="3"/>`;
  }
  const wrap = document.createElement("div");
  wrap.className = "gearWrap";
  wrap.style.cssText = `left:${cx-size/2}px;top:${cy-size/2}px;width:${size}px;height:${size}px`;
  wrap.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <path d="M${pts.map(p => p.join(",")).join("L")}Z" fill="#0e0d14" stroke="url(#goldG)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="${c}" cy="${c}" r="${ri*.84}" fill="none" stroke="#C9A24B" stroke-opacity=".55" stroke-width="2"/>
    ${spokes}
    <circle cx="${c}" cy="${c}" r="${ri*.30}" fill="#07060c" stroke="url(#goldG)" stroke-width="2.5"/>
    <circle cx="${c}" cy="${c}" r="${ri*.10}" fill="#C9A24B"/>
  </svg>`;
  document.getElementById("alert").appendChild(wrap);
  const svg = wrap.firstElementChild;
  gears.push({wrap, svg, dur, reverse});
}
makeGear(-24,  330, 16, 84, 70, 24, false);
makeGear(924,  330, 16, 84, 70, 24, true);
makeGear(40,   470, 10, 46, 38, 14, true);
makeGear(860,  470, 10, 46, 38, 14, false);

/* ════════════════════════════════════════════════════════════
   5) OUTILS : textes, couleurs, sons
   ════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const alertEl = $("alert");

function hexToRgba(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;
}
function fmtMoney(amount, currency){
  const cur = (currency || CONFIG.currency || "EUR").toUpperCase();
  try { return new Intl.NumberFormat("fr-FR", {style:"currency", currency:cur}).format(+amount); }
  catch(e){ return `${amount} ${cur}`; }
}
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function template(str, d){
  /* Les valeurs dynamiques sont échappées ; seul le gabarit (écrit par toi) peut contenir du HTML */
  return str.replace(/\{(\w+)\}/g, (_, k) => d[k] != null ? esc(d[k]) : "");
}
function tierLabel(plan){
  const p = String(plan || "").toLowerCase();
  if (p === "prime") return "Prime";
  if (p === "2000") return "Tier 2";
  if (p === "3000") return "Tier 3";
  return "Tier 1";
}
function fitName(el, maxW){
  el.style.fontSize = "68px";
  let size = 68;
  while (el.offsetWidth > maxW && size > 26){ size -= 3; el.style.fontSize = size + "px"; }
}

/* Sons : fichier si fourni, sinon petit carillon synthétique (optionnel) */
let actx;
const NOTES = {
  follow:[880,1318], sub:[523,659,784], resub:[523,659,784,1046], gift:[587,740,880],
  donation:[659,880,1175], raid:[392,523,392,659], bits:[988,1319]
};
function playSound(type){
  const cfg = CONFIG.alerts[type];
  try {
    if (cfg.sound){ const a = new Audio(cfg.sound); a.volume = CONFIG.volume; a.play().catch(() => {}); return; }
    if (!CONFIG.synthSound) return;
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    (NOTES[type] || [880]).forEach((f, i) => {
      const t = actx.currentTime + i * .1, o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(CONFIG.volume * .35, t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + 1.1);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 1.2);
    });
  } catch(e){}
}

/* ════════════════════════════════════════════════════════════
   6) EFFETS : éclats de cristal + étincelles
   ════════════════════════════════════════════════════════════ */
function burst(accent){
  const box = $("sparks"), rand = (a,b) => a + Math.random()*(b-a);
  for (let i = 0; i < 12; i++){
    const ang = i * 30 + rand(-8, 8), dist = rand(190, 340), rad = (ang - 90) * Math.PI / 180;
    const s = document.createElement("i"); s.className = "shard"; box.appendChild(s);
    gsap.fromTo(s, {x:0, y:0, rotation:ang, opacity:1, scaleY:.4},
      {x:Math.cos(rad)*dist, y:Math.sin(rad)*dist, scaleY:1.2, opacity:0, duration:rand(1.0, 1.5), ease:"power3.out", onComplete(){ s.remove(); }});
  }
  for (let i = 0; i < 30; i++){
    const ang = rand(0, Math.PI*2), dist = rand(120, 460);
    const p = document.createElement("i"); p.className = "spark"; box.appendChild(p);
    p.style.background = i % 3 ? accent : "#F3DC9A";
    gsap.fromTo(p, {x:0, y:0, rotation:45, scale:1, opacity:1},
      {x:Math.cos(ang)*dist, y:Math.sin(ang)*dist*.8, rotation:rand(45, 360), scale:0, opacity:0, duration:rand(1.1, 2), ease:"power2.out", onComplete(){ p.remove(); }});
  }
}

/* ════════════════════════════════════════════════════════════
   7) LECTURE D'UNE ALERTE (entrée → affichage → sortie)
   ════════════════════════════════════════════════════════════ */
const idle = gears.map(g => gsap.to(g.svg, {rotation:g.reverse ? -360 : 360, duration:g.dur, repeat:-1, ease:"none", paused:true}));

function play(type, d){
  return new Promise(resolve => {
    const cfg = CONFIG.alerts[type];

    /* Couleurs de l'alerte */
    alertEl.style.setProperty("--accent", cfg.color);
    alertEl.style.setProperty("--accent2", cfg.color2);
    alertEl.style.setProperty("--accentA", hexToRgba(cfg.color, .55));

    /* Textes dynamiques */
    d.tier = d.tier || tierLabel(d.plan);
    $("aLabel").textContent = cfg.label;
    $("aName").textContent = d.name || "Anonyme";
    $("aDetail").innerHTML = template(cfg.detail, d);
    const hasMsg = !!(d.message && String(d.message).trim());
    $("aMsg").style.display = hasMsg ? "" : "none";
    $("aMsg").textContent = hasMsg ? "“" + String(d.message).trim().slice(0, 160) + "”" : "";

    alertEl.style.visibility = "visible";
    fitName($("aName"), 780);

    /* États initiaux */
    gsap.set("#aShade", {x:0, y:0});
    gsap.set("#emblem", {opacity:0, scale:.2, transformOrigin:"50% 50%"});
    gsap.set("#cardBg", {clipPath:"inset(0 50% 0 50%)"});
    gsap.set(".corner", {scale:0});
    gsap.set("#aLabel, #aName, #aDetail, #aMsg", {opacity:0, y:16});
    gsap.set("#aGlow", {opacity:0});
    gears.forEach(g => gsap.set(g.wrap, {scale:0, opacity:0, rotation:-180}));
    idle.forEach(t => t.play());
    playSound(type);

    const hold = Math.max(3, cfg.duration + (hasMsg ? 2 : 0));
    const tl = gsap.timeline({defaults:{ease:"power3.out"}, onComplete(){
      alertEl.style.visibility = "hidden"; idle.forEach(t => t.pause()); resolve();
    }});

    /* ── ENTRÉE ── */
    tl.to("#flash", {opacity:.5, duration:.12}, 0)
      .to("#flash", {opacity:0, duration:.9, ease:"power2.out"}, .12)
      .to("#aGlow", {opacity:1, duration:1}, 0)
      .to("#emblem", {opacity:1, scale:1, duration:.8, ease:"back.out(1.5)"}, 0)
      /* l'éclipse s'ouvre : le disque sombre glisse et révèle le soleil */
      .to("#aShade", {x:78, y:-30, duration:1.1, ease:"power3.inOut"}, .45)
      .fromTo("#aBurst", {opacity:.95, scale:1, svgOrigin:"220 220"}, {opacity:0, scale:2.6, svgOrigin:"220 220", duration:1.5, ease:"power2.out"}, .55)
      .add(() => burst(cfg.color), .55)
      .to("#cardBg", {clipPath:"inset(0 0% 0 0%)", duration:.85, ease:"power4.out"}, .65)
      .to(".corner", {scale:1, duration:.5, stagger:.08, ease:"back.out(2)"}, .9)
      .to(gears.map(g => g.wrap), {scale:1, opacity:1, rotation:0, duration:1, stagger:.1, ease:"back.out(1.6)"}, .8)
      .to("#aLabel", {opacity:1, y:0, duration:.55}, 1.0)
      .fromTo("#aName", {opacity:0, y:0, letterSpacing:"0.35em", filter:"blur(12px)"},
                        {opacity:1, letterSpacing:"0.08em", filter:"blur(0px)", duration:.9, clearProps:"filter"}, 1.15)
      .to("#aDetail", {opacity:1, y:0, duration:.6}, 1.45)
      .to("#aMsg", {opacity:1, y:0, duration:.6}, 1.65)

      /* ── AFFICHAGE ── */
      .to({}, {duration:hold})

      /* ── SORTIE ── */
      .to("#aMsg, #aDetail, #aName, #aLabel", {opacity:0, y:-12, duration:.35, stagger:.04, ease:"power2.in"})
      .to("#cardBg", {clipPath:"inset(0 50% 0 50%)", duration:.55, ease:"power3.in"}, "<.15")
      .to(".corner", {scale:0, duration:.3, ease:"power2.in"}, "<")
      .to(gears.map(g => g.wrap), {scale:0, opacity:0, rotation:180, duration:.55, stagger:.05, ease:"back.in(1.6)"}, "<")
      .to("#aShade", {x:0, y:0, duration:.6, ease:"power2.inOut"}, "<.1")
      .to("#emblem", {opacity:0, scale:.2, duration:.55, ease:"back.in(1.5)"}, "<.25")
      .to("#aGlow", {opacity:0, duration:.5}, "<")
      .to("#flash", {opacity:.2, duration:.1}, "<.2")
      .to("#flash", {opacity:0, duration:.5}, ">");
  });
}

/* ════════════════════════════════════════════════════════════
   8) FILE D'ATTENTE + API PUBLIQUE
   ════════════════════════════════════════════════════════════ */
const queue = [], seen = {};
let busy = false;

/* Informe l'overlay en jeu (dernier follower / sub / objectif) */
const bus = ("BroadcastChannel" in window) ? new BroadcastChannel("vtuber-overlay") : null;
function sendBus(msg){
  try { bus && bus.postMessage(msg); } catch(e){}
  try { localStorage.setItem("vtuber_overlay_event", JSON.stringify({...msg, t:Date.now()})); } catch(e){}
}

function pump(){
  if (busy || !queue.length) return;
  busy = true;
  const {type, data} = queue.shift();
  play(type, data).then(() => setTimeout(() => { busy = false; pump(); }, CONFIG.gap * 1000));
}

/* Déclenche une alerte : Alerts.trigger("follow", {name:"Luna"}) */
function trigger(type, data){
  if (!CONFIG.alerts[type]) return;
  data = data || {};
  if (!data.test){
    const key = `${type}|${data.name}|${data.amount || ""}`, now = Date.now();
    if (seen[key] && now - seen[key] < 8000) return;
    seen[key] = now;
    if (type === "follow") sendBus({type:"follow", name:data.name});
    if (type === "sub" || type === "resub") sendBus({type:"sub", name:data.name});
  }
  queue.push({type, data});
  if (queue.length > 30) queue.shift();
  pump();
}
window.Alerts = { trigger };

/* ════════════════════════════════════════════════════════════
   9) SOURCES D'ÉVÉNEMENTS

/* ── 9a) Twitch (anonyme) : sub, resub, sub offerts, raids, bits ── */
const channel = (params.get("channel") || "").toLowerCase().replace(/^#/, "");
const giftSkip = {};
function connectTwitch(){
  const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
    ws.send("PASS SCHMOOCHIEPOO");
    ws.send("NICK justinfan" + Math.floor(10000 + Math.random()*89999));
    ws.send("JOIN #" + channel);
  };
  ws.onmessage = ev => ev.data.split("\r\n").filter(Boolean).forEach(line => {
    if (line.startsWith("PING")) return ws.send("PONG :tmi.twitch.tv");
    const m = line.match(/^@(\S+) :(\S+) (PRIVMSG|USERNOTICE) #\S+(?: :(.*))?$/);
    if (!m) return;
    const tags = {};
    m[1].split(";").forEach(t => { const i = t.indexOf("="); tags[t.slice(0,i)] = t.slice(i+1).replace(/\\s/g, " "); });
    const login = m[2].split("!")[0], name = tags["display-name"] || login, text = m[4] || "";

    if (m[3] === "PRIVMSG"){
      if (tags.bits) trigger("bits", {name, amount:tags.bits, message:text});
      return;
    }
    const id = tags["msg-id"], now = Date.now();
    if (id === "sub")      trigger("sub",   {name, plan:tags["msg-param-sub-plan"], message:text});
    else if (id === "resub") trigger("resub", {name, months:tags["msg-param-cumulative-months"], plan:tags["msg-param-sub-plan"], message:text});
    else if (id === "submysterygift"){
      giftSkip[login] = now + 20000;
      trigger("gift", {name, amount:tags["msg-param-mass-gift-count"] || 1});
    }
    else if (id === "subgift"){
      if ((giftSkip[login] || 0) > now) return;          // déjà annoncé par le cadeau groupé
      trigger("gift", {name, amount:1});
    }
    else if (id === "raid") trigger("raid", {name:tags["msg-param-displayName"] || name, amount:tags["msg-param-viewerCount"]});
  });
  ws.onclose = () => setTimeout(connectTwitch, 5000);
  ws.onerror = () => ws.close();
}
if (channel) connectTwitch();

/* ── Chargement de socket.io 2.x (uniquement si StreamElements / Streamlabs demandé) ── */
function loadSocketIO(cb){
  if (window.io) return cb();
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.4.0/socket.io.js";
  s.onload = cb; document.head.appendChild(s);
}

/* ── 9b) StreamElements ── */
const seJWT = params.get("se");
if (seJWT) loadSocketIO(() => {
  const socket = io("https://realtime.streamelements.com", {transports:["websocket"]});
  socket.on("connect", () => socket.emit("authenticate", {method:"jwt", token:seJWT}));
  socket.on("authenticated", () => console.log("[Alertes] StreamElements connecté"));
  socket.on("unauthorized", () => console.warn("[Alertes] JWT StreamElements invalide"));

  const handle = (type, d) => {
    switch (type){
      case "follow":     trigger("follow", {name:d.username || d.displayName}); break;
      case "subscriber":
        if (d.gifted && d.sender) trigger("gift", {name:d.sender, amount:1});
        else if ((+d.amount || 1) > 1) trigger("resub", {name:d.username || d.displayName, months:d.amount, plan:d.tier, message:d.message});
        else trigger("sub", {name:d.username || d.displayName, plan:d.tier, message:d.message});
        break;
      case "tip":        trigger("donation", {name:d.username || d.displayName, amount:fmtMoney(d.amount, d.currency), message:d.message}); break;
      case "cheer":      trigger("bits", {name:d.username || d.displayName, amount:d.amount, message:d.message}); break;
      case "raid":       trigger("raid", {name:d.username || d.displayName, amount:d.amount}); break;
    }
  };
  socket.on("event", ev => ev && ev.data && handle(ev.type, ev.data));
  /* Boutons "Tester" du tableau de bord StreamElements */
  socket.on("event:test", ev => {
    if (!ev || !ev.event) return;
    const map = {"follower-latest":"follow","subscriber-latest":"subscriber","tip-latest":"tip","cheer-latest":"cheer","raid-latest":"raid"};
    const t = map[ev.listener]; if (!t) return;
    const e = ev.event;
    handle(t, {username:e.name, amount:e.amount, tier:e.tier, message:e.message, currency:CONFIG.currency, gifted:e.gifted, sender:e.sender});
  });
});

/* ── 9c) Streamlabs ── */
const slToken = params.get("sl");
if (slToken) loadSocketIO(() => {
  const socket = io("https://sockets.streamlabs.com?token=" + encodeURIComponent(slToken), {transports:["websocket"]});
  socket.on("connect", () => console.log("[Alertes] Streamlabs connecté"));
  socket.on("event", ev => {
    if (!ev || !ev.message) return;
    const list = Array.isArray(ev.message) ? ev.message : [ev.message];
    list.forEach(m => {
      switch (ev.type){
        case "follow":       trigger("follow", {name:m.name}); break;
        case "subscription":
        case "resub":
          if (m.gifter) trigger("gift", {name:m.gifter, amount:1});
          else if ((+m.months || 1) > 1) trigger("resub", {name:m.name, months:m.months, plan:m.sub_plan, message:m.message});
          else trigger("sub", {name:m.name, plan:m.sub_plan, message:m.message});
          break;
        case "donation":     trigger("donation", {name:m.name, amount:fmtMoney(m.amount, m.currency), message:m.message}); break;
        case "bits":         trigger("bits", {name:m.name, amount:m.amount, message:m.message}); break;
        case "raid":         trigger("raid", {name:m.name, amount:m.raiders}); break;
      }
    });
  });
});
